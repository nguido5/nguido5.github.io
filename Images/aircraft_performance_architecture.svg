<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
<title id="title">Aircraft Performance Analysis and Mission Planning Architecture</title>
<desc id="desc">Architecture diagram showing aircraft configuration models and atmospheric environment feeding maneuver solvers and a mission planner interface.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
  </marker>
  <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
  </marker>
  <style>
    .panel{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}
    .module{fill:#ffffff;stroke:#475569;stroke-width:2}
    .submodule{fill:#eff6ff;stroke:#60a5fa;stroke-width:1.7}
    .env{fill:#f0fdf4;stroke:#4d9b72;stroke-width:2}
    .solver{fill:#eef2ff;stroke:#6366f1;stroke-width:2.2}
    .planner{fill:#fff7ed;stroke:#ea8a32;stroke-width:2.2}
    .heading{font:700 23px Arial,Helvetica,sans-serif;fill:#0f172a}
    .subheading{font:700 17px Arial,Helvetica,sans-serif;fill:#1e293b}
    .body{font:15px Arial,Helvetica,sans-serif;fill:#334155}
    .small{font:13px Arial,Helvetica,sans-serif;fill:#475569}
    .tiny{font:12px Arial,Helvetica,sans-serif;fill:#475569}
    .flow{fill:none;stroke:#334155;stroke-width:2.4;marker-end:url(#arrow);stroke-linecap:round;stroke-linejoin:round}
    .flowBlue{fill:none;stroke:#2563eb;stroke-width:2.4;marker-end:url(#arrowBlue);stroke-linecap:round;stroke-linejoin:round}
    .dashed{stroke-dasharray:7 6}
    .section{font:700 14px Arial,Helvetica,sans-serif;letter-spacing:1.3px;fill:#64748b}
  </style>
</defs>
<rect width="1600" height="1080" fill="#ffffff"/>
<text x="70" y="52" class="heading" style="font-size:29px">Aircraft Performance Analysis &amp; Mission Planning</text>
<text x="70" y="80" class="body">System architecture • model inputs, environmental conditions, maneuver analysis, and mission-level interface</text>
<line x1="70" y1="100" x2="1530" y2="100" stroke="#cbd5e1" stroke-width="1.5"/>

<!-- Aircraft model domain -->
<rect x="65" y="130" width="1035" height="405" rx="14" class="panel"/>
<text x="90" y="164" class="section">AIRCRAFT MODEL</text>

<!-- Main model blocks -->
<rect x="95" y="190" width="205" height="125" rx="9" class="module"/>
<text x="197.5" y="220" text-anchor="middle" class="subheading">Geometry</text>
<line x1="115" y1="232" x2="280" y2="232" stroke="#e2e8f0"/>
<text x="115" y="255" class="body">• Wing area, S</text>
<text x="115" y="276" class="body">• Wingspan, b</text>
<text x="115" y="297" class="body">• Aspect ratio, AR</text>

<rect x="335" y="190" width="220" height="125" rx="9" class="module"/>
<text x="445" y="220" text-anchor="middle" class="subheading">Aerodynamics</text>
<line x1="355" y1="232" x2="535" y2="232" stroke="#e2e8f0"/>
<text x="355" y="255" class="body">• Drag polar / drag model</text>
<text x="355" y="276" class="body">• \(C_{D0}\), induced drag</text>
<text x="355" y="297" class="body">• Lift / Mach limits</text>

<rect x="590" y="190" width="255" height="125" rx="9" class="module"/>
<text x="717.5" y="220" text-anchor="middle" class="subheading">Propulsion</text>
<line x1="610" y1="232" x2="825" y2="232" stroke="#e2e8f0"/>
<text x="610" y="255" class="body">• Engine count and rating</text>
<text x="610" y="276" class="body">• Thrust / power available</text>
<text x="610" y="297" class="body">• TSFC / BSFC model</text>

<rect x="880" y="190" width="190" height="125" rx="9" class="module"/>
<text x="975" y="220" text-anchor="middle" class="subheading">Mass Properties</text>
<line x1="900" y1="232" x2="1050" y2="232" stroke="#e2e8f0"/>
<text x="900" y="255" class="body">• Empty / payload mass</text>
<text x="900" y="276" class="body">• Current mass</text>
<text x="900" y="297" class="body">• Moments of inertia</text>

<!-- Model relationships -->
<path d="M300 252 H328" class="flow"/>
<path d="M555 252 H583" class="flow"/>
<path d="M845 252 H873" class="flow"/>

<!-- Propulsion submodels -->
<text x="590" y="350" class="small" style="font-weight:700">Selectable propulsion model</text>
<rect x="590" y="365" width="135" height="85" rx="8" class="submodule"/>
<text x="657.5" y="390" text-anchor="middle" class="subheading">Turbofan</text>
<text x="657.5" y="414" text-anchor="middle" class="small">Rated thrust</text>
<text x="657.5" y="433" text-anchor="middle" class="small">T / P available</text>
<rect x="745" y="365" width="135" height="85" rx="8" class="submodule"/>
<text x="812.5" y="390" text-anchor="middle" class="subheading">Turbojet</text>
<text x="812.5" y="414" text-anchor="middle" class="small">Rated thrust</text>
<text x="812.5" y="433" text-anchor="middle" class="small">T / P available</text>
<rect x="900" y="365" width="170" height="85" rx="8" class="submodule"/>
<text x="985" y="390" text-anchor="middle" class="subheading">Propeller</text>
<text x="985" y="414" text-anchor="middle" class="small">Shaft power</text>
<text x="985" y="433" text-anchor="middle" class="small">Propulsive efficiency</text>
<path d="M717 315 V337 H657 V358" class="flowBlue"/>
<path d="M717 337 H812 V358" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<path d="M812 337 H985 V358" fill="none" stroke="#2563eb" stroke-width="2.2"/>
<text x="95" y="365" class="small" style="font-weight:700">Model parameters / configuration data</text>
<text x="95" y="391" class="body">• Geometry and aerodynamic coefficients</text>
<text x="95" y="415" class="body">• Engine-specific performance maps</text>
<text x="95" y="439" class="body">• Mass state and configuration limits</text>
<text x="95" y="485" class="small">Aircraft class assembles the selected models into a consistent vehicle definition.</text>

<!-- Environment -->
<rect x="1140" y="130" width="395" height="405" rx="14" class="env"/>
<text x="1165" y="164" class="section" style="fill:#367653">ENVIRONMENT MODEL</text>
<rect x="1165" y="190" width="345" height="76" rx="8" fill="#ffffff" stroke="#86b99a" stroke-width="1.5"/>
<text x="1185" y="218" class="subheading">Baseline atmosphere</text>
<text x="1185" y="242" class="body">Simple lapse-rate model • 0–20 km</text>
<rect x="1165" y="282" width="345" height="76" rx="8" fill="#ffffff" stroke="#86b99a" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="1185" y="310" class="subheading">Planned extensions</text>
<text x="1185" y="334" class="body">Weather / wind API • improved atmosphere</text>
<text x="1165" y="390" class="subheading">Environmental quantities</text>
<text x="1185" y="416" class="body">• Gravity, g(h)</text>
<text x="1185" y="440" class="body">• Freestream temperature and density</text>
<text x="1185" y="464" class="body">• Speed of sound and dynamic viscosity</text>
<rect x="1165" y="482" width="345" height="32" rx="6" fill="#dcfce7" stroke="#86b99a"/>
<text x="1337.5" y="503" text-anchor="middle" class="small" style="font-weight:700">Geographic / world-map context</text>

<!-- Core flow into analysis -->
<path d="M585 535 V575" class="flow"/>
<path d="M1337 535 V555 H1000 V575" class="flowBlue"/>
<rect x="390" y="575" width="350" height="105" rx="12" class="module"/>
<text x="565" y="608" text-anchor="middle" class="heading" style="font-size:21px">Aircraft Class</text>
<text x="565" y="634" text-anchor="middle" class="body">Owns geometry, aero, propulsion, mass</text>
<text x="565" y="655" text-anchor="middle" class="small">Provides state-dependent aircraft properties</text>

<rect x="825" y="575" width="350" height="105" rx="12" class="env"/>
<text x="1000" y="608" text-anchor="middle" class="heading" style="font-size:21px">Environment Service</text>
<text x="1000" y="634" text-anchor="middle" class="body">Atmosphere, gravity, wind / weather</text>
<text x="1000" y="655" text-anchor="middle" class="small">Evaluated at position, altitude, and time</text>

<!-- Solver -->
<path d="M565 680 V722 H750 V745" class="flow"/>
<path d="M1000 680 V722 H850 V745" class="flowBlue"/>
<rect x="355" y="745" width="890" height="170" rx="14" class="solver"/>
<text x="800" y="782" text-anchor="middle" class="heading">Maneuver Solvers</text>
<text x="800" y="808" text-anchor="middle" class="body">Evaluate performance and feasibility using aircraft and environment models</text>
<line x1="390" y1="828" x2="1210" y2="828" stroke="#c7d2fe" stroke-width="1.5"/>
<rect x="390" y="846" width="180" height="43" rx="7" fill="#ffffff" stroke="#a5b4fc"/>
<text x="480" y="873" text-anchor="middle" class="body">Range &amp; endurance</text>
<rect x="590" y="846" width="145" height="43" rx="7" fill="#ffffff" stroke="#a5b4fc"/>
<text x="662.5" y="873" text-anchor="middle" class="body">Maximum speed</text>
<rect x="755" y="846" width="145" height="43" rx="7" fill="#ffffff" stroke="#a5b4fc"/>
<text x="827.5" y="873" text-anchor="middle" class="body">Climb performance</text>
<rect x="920" y="846" width="125" height="43" rx="7" fill="#ffffff" stroke="#a5b4fc"/>
<text x="982.5" y="873" text-anchor="middle" class="body">Level turn</text>
<rect x="1065" y="846" width="145" height="43" rx="7" fill="#ffffff" stroke="#a5b4fc"/>
<text x="1137.5" y="873" text-anchor="middle" class="body">Other maneuvers</text>

<!-- Mission planner -->
<path d="M800 915 V945" class="flow"/>
<rect x="355" y="945" width="890" height="92" rx="13" class="planner"/>
<text x="800" y="978" text-anchor="middle" class="heading">Mission Planner &amp; User Interface</text>
<text x="800" y="1004" text-anchor="middle" class="body">Mission definition • route / waypoint planning • performance visualization • results export</text>
<path d="M1510 498 H1560 V991 H1253" class="flowBlue dashed"/>
<text x="1530" y="742" text-anchor="middle" class="tiny" transform="rotate(-90 1530 742)">Map / weather context to mission planning</text>

<!-- Footer -->
<text x="70" y="1060" class="tiny">Solid arrows indicate primary data flow. Dashed links indicate optional or planned integrations.</text>
</svg>